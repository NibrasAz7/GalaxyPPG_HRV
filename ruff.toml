line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "BLE001",  # broad excepts are intentional in the ingestion/figure layers
    "E501",    # line length is enforced informally
    "RUF001",  # typographic dashes are intentional in docstrings
    "RUF002",
    "RUF003",
    "RUF046",  # int() casts on numpy sizes kept for clarity
]
